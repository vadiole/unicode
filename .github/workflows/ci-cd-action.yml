name: CI/CD

on:
  push:
    branches-ignore: [ master ]
  pull_request:
    branches-ignore: [ master ]
    types: [ opened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish alpha APK
    runs-on: ubuntu-latest
    steps:
      - name: Set start time
        id: start
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
      - name: Checkout the repo
        uses: actions/checkout@v5
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Assemble alpha APK
        run: ./gradlew assembleAlpha
      - name: Publish alpha APK to Telegram
        run: |
          formatDuration() { # like 1m 1s
              local ms=$1
              m=$((ms / 60))
              s=$((ms % 60));
              echo $([ "$m" -gt 0 ] && echo "${m}m ")${s} s;
          }
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          FILE_PATH=$(find ./app/build/outputs/apk/alpha/ -name '*.apk' | head -n 1)
          DURATION=$(( $(date +%s) - $START_TIME ))
          CAPTION="${{ github.head_ref || github.ref_name }}"$'\n'"[$(formatDuration $DURATION)]"

          curl --silent --show-error -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F document=@"$FILE_PATH" \
              -F caption="$CAPTION"
      - name: Run lint
        run: ./gradlew lintDebug
